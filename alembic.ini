; Alembic configuration for the service desk (api/servicedesk) only.
; The Operations Research engine (api/engine) has no database and is untouched
; by anything under migrations/.
;
; The database is chosen by the DATABASE_URL environment variable, not by this
; file, so the same migration head is reachable on PostgreSQL and on the SQLite
; demo file without editing configuration.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
